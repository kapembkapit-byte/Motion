<!doctype html>
<html lang="fr">

  .el { position: absolute; left: 0; width: 1080px; text-align: center; opacity: 0; will-change: transform, opacity; }

  .title { font-family: "Inter Display", "Inter", sans-serif; font-weight: 600; font-size: 70px; letter-spacing: -0.5px; line-height: 1; }

  #t2 { top: 342px; }
  #cap { top: 1712px; font-weight: 600; font-size: 52px; color: #3c3c40; }
  #dots { top: 1810px; display: flex; justify-content: center; gap: 26px; }
  #dots span { width: 30px; height: 30px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); transition: none; }
  #hurry { top: 250px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; font-size: 78px; }
  #price { top: 985px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; font-size: 236px; color: #1a4fc9; letter-spacing: -4px; line-height: 1; }
  #old { top: 1262px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 500; font-size: 80px; color: #6e6e73; }
  #old s { text-decoration: none; position: relative; }
  #old s::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 7px; background: #e53935; transform-origin: left; transform: scaleX(var(--strike, 0)); }
  #pill { top: 1405px; }
  #pill span { display: inline-block; background: #1d1d1f; color: #fff; font-weight: 600; font-size: 40px; padding: 20px 38px; border-radius: 60px; }
  #site { top: 1545px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; font-size: 66px; }
  #wa { top: 1665px; font-weight: 600; font-size: 52px; display: flex; justify-content: center; align-items: center; gap: 24px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
